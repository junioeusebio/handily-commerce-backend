name: Migrate Supabase

# Password stays in Actions secret CONNECTIONSTRINGS_DEFAULT (never in git/logs).
on:
  workflow_dispatch:
    inputs:
      git_ref:
        description: Git ref that contains the EF migrations (branch, tag, or SHA)
        required: true
        default: main
  push:
    branches: [main]
    paths:
      - src/HandilyCommerce.Infrastructure/Persistence/Migrations/**

concurrency:
  group: migrate-supabase
  cancel-in-progress: false

jobs:
  migrate:
    name: EF database update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git_ref || github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore
        run: dotnet restore HandilyCommerce.slnx

      - name: Apply migrations
        env:
          RAW_CONN: ${{ secrets.CONNECTIONSTRINGS_DEFAULT }}
        run: bash scripts/apply-ef-migrations.sh
