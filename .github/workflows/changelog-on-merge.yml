name: Changelog on Major/Mirror merge

on:
  pull_request:
    types: [closed]
    branches: [main]

# Branch protection on main blocks direct pushes (GH006). We open a Patch PR
# instead of pushing to main so required checks still run.
permissions:
  contents: write
  pull-requests: write

jobs:
  append-changelog:
    name: Append changelog entry
    if: >
      github.event.pull_request.merged == true &&
      (
        contains(join(github.event.pull_request.labels.*.name, ','), 'Release Major') ||
        contains(join(github.event.pull_request.labels.*.name, ','), 'Release Mirror')
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Resolve release label
        id: label
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          label=""
          IFS=',' read -ra parts <<< "$LABELS"
          for name in "${parts[@]}"; do
            case "$name" in
              "Release Major"|"Release Mirror")
                if [ -n "$label" ] && [ "$label" != "$name" ]; then
                  echo "::error::Multiple Major/Mirror labels on PR; refuse to append."
                  exit 1
                fi
                label="$name"
                ;;
            esac
          done
          if [ -z "$label" ]; then
            echo "::error::Expected Release Major or Release Mirror label."
            exit 1
          fi
          echo "value=$label" >> "$GITHUB_OUTPUT"

      - name: Append entry
        # Temporary: appends to committed changelog.json.
        # After the next micro-PR (B1 SQL + EF Core IChangelogRepository), this step becomes
        # an INSERT into ChangelogEntries (same Guid id + fields) instead of editing JSON.
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGED_AT: ${{ github.event.pull_request.merged_at }}
          LABEL: ${{ steps.label.outputs.value }}
        run: |
          set -euo pipefail
          python3 scripts/append-changelog \
            --title "$PR_TITLE" \
            --body "$PR_BODY" \
            --pr-number "$PR_NUMBER" \
            --label "$LABEL" \
            --merged-at "$MERGED_AT"

      - name: Open changelog PR (never push to main)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          FILE="src/HandilyCommerce.Infrastructure/Changelog/changelog.json"
          BRANCH="chore/changelog-pr-${PR_NUMBER}"

          if git diff --quiet -- "$FILE"; then
            echo "No changelog file changes (already present or skipped)."
            exit 0
          fi

          # If a changelog PR for this source PR already exists, nothing to do.
          existing="$(gh pr list --base main --head "$BRANCH" --state open --json number --jq 'length')"
          if [ "$existing" != "0" ]; then
            echo "Open PR already exists for branch $BRANCH; exit 0."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add "$FILE"
          git commit -m "chore(changelog): append PR #${PR_NUMBER}"

          # Never push to main — branch protection requires a PR + checks (GH006).
          git push -u origin HEAD

          if ! gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(changelog): append PR #${PR_NUMBER}" \
            --body "Automated changelog append after a Release Major/Mirror merge.

Opens a PR instead of updating \`main\` directly because branch protection
blocks direct pushes (\`GH006\`) and requires a pull request + checks." \
            --label "Release Patch"; then
            # Race: PR created concurrently, or create rejected as duplicate.
            echo "gh pr create reported failure (PR may already exist); treating as success."
            exit 0
          fi
