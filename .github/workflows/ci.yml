name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run mid-migration; PRs still cancel superseded runs.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: global.json

      - name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Check conn-string parser (Migrate Supabase)
        run: bash scripts/check-conn-string-parse.sh

      - name: Restore
        run: dotnet restore HandilyCommerce.slnx

      - name: Build
        run: dotnet build HandilyCommerce.slnx --no-restore -c Release

      - name: Test with coverage (Coverlet line threshold ≥ 80%)
        run: |
          dotnet test HandilyCommerce.slnx \
            --no-build \
            -c Release \
            --collect:"XPlat Code Coverage" \
            --results-directory ./coverage \
            --settings coverlet.runsettings \
            /p:CollectCoverage=true \
            /p:CoverletOutputFormat=opencover \
            /p:Threshold=80 \
            /p:ThresholdType=line \
            -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/**
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    needs: build
    runs-on: ubuntu-latest

    env:
      # Dependabot PRs don't get repo secrets; without SONAR_TOKEN the analysis is skipped (job stays green).
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Skip notice (no SONAR_TOKEN)
        if: env.HAS_SONAR_TOKEN != 'true'
        run: echo "::warning::SONAR_TOKEN indisponível (ex. PR do Dependabot). Análise Sonar pulada. Para analisar, adicione SONAR_TOKEN em Settings → Secrets → Dependabot."

      - name: Checkout
        if: env.HAS_SONAR_TOKEN == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - if: env.HAS_SONAR_TOKEN == 'true'
        name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: global.json

      - if: env.HAS_SONAR_TOKEN == 'true'
        name: Setup Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - if: env.HAS_SONAR_TOKEN == 'true'
        name: Install SonarScanner for .NET
        run: dotnet tool install --global dotnet-sonarscanner

      - if: env.HAS_SONAR_TOKEN == 'true'
        name: Cache NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - if: env.HAS_SONAR_TOKEN == 'true'
        name: Download coverage
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: coverage

      - if: env.HAS_SONAR_TOKEN == 'true'
        name: Begin SonarScanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"junioeusebio_handily-commerce-backend" \
            /o:"junioeusebio" \
            /d:sonar.token="${SONAR_TOKEN}" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.qualitygate.wait=true \
            /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage/**/coverage.opencover.xml" \
            /d:sonar.coverage.exclusions="**/Program.cs,**/Persistence/Migrations/**,**/HandilyCommerceDbContextFactory.cs,scripts/**" \
            /d:sonar.exclusions="**/bin/**,**/obj/**,**/coverage/**,scripts/**"

      - if: env.HAS_SONAR_TOKEN == 'true'
        name: Restore
        run: dotnet restore HandilyCommerce.slnx

      - if: env.HAS_SONAR_TOKEN == 'true'
        name: Build (for Sonar analysis)
        run: dotnet build HandilyCommerce.slnx --no-restore -c Release

      - if: env.HAS_SONAR_TOKEN == 'true'
        name: End SonarScanner
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="${SONAR_TOKEN}"

  migrate:
    name: Migrate Supabase
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: sonar
    runs-on: ubuntu-latest
    concurrency:
      group: migrate-supabase
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          global-json-file: global.json

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef

      - name: Restore
        run: dotnet restore HandilyCommerce.slnx

      - name: Apply migrations
        env:
          RAW_CONN: ${{ secrets.CONNECTIONSTRINGS_DEFAULT }}
        run: bash scripts/apply-ef-migrations.sh

  deploy:
    name: Deploy Render
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: migrate
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "Missing secret RENDER_DEPLOY_HOOK. Disable auto-deploy on Render and add the hook URL as repo secret."
            exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK"

  smoke:
    name: Smoke Test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Ping + apiVersion matches Directory.Build.props
        env:
          BASE_URL: https://handily-commerce-backend.onrender.com/api/v1
        run: |
          expected=$(grep -oP '(?<=<Version>)[^<]+' Directory.Build.props | head -1)
          echo "Expected version: $expected"
          # Render free: cold start + deploy build can take minutes. Poll up to ~10 min.
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$BASE_URL/ping" || echo 000)
            version=$(curl -fsS --max-time 60 "$BASE_URL/apiVersion" 2>/dev/null | jq -r '.version // empty' || true)
            echo "Try $i: ping=$code version=${version:-?}"
            if [ "$code" = "200" ] && [ "$version" = "$expected" ]; then
              echo "Smoke OK"
              exit 0
            fi
            sleep 30
          done
          echo "Smoke FAILED: API not healthy on version $expected after ~10 min"
          exit 1
