# Dependabot: NuGet + GitHub Actions (semanal).
# Label "Release Patch" satisfaz o check require-release-label (pr-release-label.yml).
# Obs.: PRs do Dependabot não fazem bump em Directory.Build.props; o bump entra no próximo PR de release.
version: 2
updates:
  - package-ecosystem: nuget
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    open-pull-requests-limit: 5
    labels:
      - "Release Patch"
    commit-message:
      prefix: "chore(deps)"
    groups:
      nuget-minor-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: America/Sao_Paulo
    labels:
      - "Release Patch"
    commit-message:
      prefix: "chore(ci)"
